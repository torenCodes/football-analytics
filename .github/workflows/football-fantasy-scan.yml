name: Football Fantasy scan

on:
  schedule:
    # Minutes deliberately off the round numbers (:00/:15/:30/:45) -- GitHub's own
    # docs warn scheduled workflows get silently skipped under load at those exact
    # marks, since that's when every other repo's cron jobs fire too. Confirmed
    # this bit us on 2026-09-15: no run of any kind (success OR failure) shows in
    # the Actions history for that day -- the trigger itself never fired.
    - cron: '7 15 * * 2'   # Tuesday ~10am ET -- primary run
    - cron: '7 19 * * 2'   # Tuesday ~3pm ET -- same-day backup, in case the morning run was skipped or ran too early
    - cron: '7 13 * * 3'   # Wednesday ~9am ET -- final backup; commit step only fires on an actual diff, so a no-op run is harmless
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Refresh nflverse data cache
        run: python scripts/ingest_historical.py
      - name: Run Fantasy scan
        run: python scripts/fantasy_scan.py
      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add data/fantasy
          git diff --staged --quiet || git commit -m "chore: fantasy scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
