name: Football Betting scan

on:
  schedule:
    # Minutes deliberately off the round numbers (:00/:15/:30/:45) -- GitHub's own
    # docs warn scheduled workflows get silently skipped under load at those exact
    # marks, since that's when every other repo's cron jobs fire too. Confirmed
    # this bit us on 2026-09-15: no run of any kind (success OR failure) shows in
    # the Actions history for that day -- the trigger itself never fired.
    #
    # Clustered right after Monday Night Football instead of Tuesday mid-morning,
    # so users see fresh data as soon as possible after the last game of the week
    # ends, not ~12 hours later -- commit step only fires on an actual diff, so a
    # run that hits incomplete/not-yet-synced nflverse data is a harmless no-op,
    # caught by the next attempt. Staggered vs. the Fantasy scan (:07 there, :37
    # here) so the two workflows don't hit the shared nflverse cache at once.
    # NOTE: cron is UTC-only, no DST awareness -- these assume EDT (UTC-4). Once
    # DST ends (~Nov 1), actual ET times shift an hour earlier (12am/3am/5am ET)
    # until this is manually adjusted for the winter offset (UTC-5).
    - cron: '37 5 * * 2'   # Tuesday ~1am ET -- primary run, right after MNF wraps
    - cron: '37 8 * * 2'   # Tuesday ~4am ET -- backup, in case nflverse data wasn't synced yet at 1am
    - cron: '37 10 * * 2'  # Tuesday ~6am ET -- second backup, same reasoning
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Refresh nflverse data cache
        run: python scripts/ingest_historical.py
      - name: Run Betting scan
        run: python scripts/betting_scan.py
      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add data/betting
          git diff --staged --quiet || git commit -m "chore: betting scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
