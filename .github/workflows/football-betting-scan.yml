name: Football Betting scan

on:
  schedule:
    # Minutes deliberately off the round numbers (:00/:15/:30/:45) -- GitHub's own
    # docs warn scheduled workflows get silently skipped under load at those exact
    # marks, since that's when every other repo's cron jobs fire too. Confirmed
    # this bit us on 2026-09-15: no run of any kind (success OR failure) shows in
    # the Actions history for that day -- the trigger itself never fired.
    #
    # Six runs/week, staggered vs. the Fantasy scan (:07 there, :37 here) so the two
    # workflows don't hit the shared nflverse cache at once. Commit step only fires
    # on an actual diff, so a run that hits incomplete/not-yet-synced nflverse data
    # is a harmless no-op, caught by the next attempt -- confirmed necessary, not
    # just theoretical: nflverse's Week 3 2026 injury report had zero rows as late
    # as Tuesday AND Wednesday that week, well after Jaxson Dart's Monday-night
    # injury -- a Tuesday-only cadence cannot see a report that doesn't exist yet.
    #   - Tuesday x3 (1am/4am/6am ET): right after MNF wraps, so users see fresh
    #     results/lines as soon as possible instead of ~12 hours later.
    #   - Wednesday x1 (6pm ET): catches that week's first official practice/injury
    #     report. No backup -- it's not the last word before kickoff, and both
    #     Friday's runs and the following Tuesday's cluster backstop it. Thursday's
    #     intermediate report is deliberately skipped between two bracketing checks.
    #   - Friday x2 (6pm/9pm ET): catches the FINAL weekly injury designations
    #     before the Sunday slate -- the highest-stakes single point of failure
    #     (last chance before kickoff, so it gets the same double-attempt treatment
    #     Tuesday already gets, not just one shot).
    # NOTE: cron is UTC-only, no DST awareness -- these assume EDT (UTC-4). Once
    # DST ends (~Nov 1), actual ET times shift an hour earlier until this is
    # manually adjusted for the winter offset (UTC-5).
    - cron: '37 5 * * 2'   # Tuesday ~1am ET -- primary run, right after MNF wraps
    - cron: '37 8 * * 2'   # Tuesday ~4am ET -- backup, in case nflverse data wasn't synced yet at 1am
    - cron: '37 10 * * 2'  # Tuesday ~6am ET -- second backup, same reasoning
    - cron: '37 22 * * 3'  # Wednesday ~6pm ET -- first official practice/injury report of the week
    - cron: '37 22 * * 5'  # Friday ~6pm ET -- final weekly injury designations before Sunday
    - cron: '37 1 * * 6'   # Friday ~9pm ET (crosses into Saturday UTC) -- backup for the Friday report
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Refresh nflverse data cache
        run: python scripts/ingest_historical.py
      - name: Run Betting scan
        run: python scripts/betting_scan.py
      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add data/betting
          git diff --staged --quiet || git commit -m "chore: betting scan $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase -Xtheirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
